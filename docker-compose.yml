services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: helpdesk
    volumes:
      - db_data:/var/lib/postgresql/data # วอลุ่มฐานข้อมูลกันข้อมูลหาย[cite: 3]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./app
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: user
      DB_PASS: password
      DB_NAME: helpdesk

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    # ports:
    #   - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter
    # ports:
    #   - "9100:9100" # ส่งข้อมูลการใช้ทรัพยากรของเครื่อง[cite: 1]

volumes:
  db_data:
