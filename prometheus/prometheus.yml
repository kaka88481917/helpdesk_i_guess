global:
  scrape_interval: 5s # ตั้งให้เก็บข้อมูลทุก 5 วินาที

scrape_configs:
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['192.168.1.59:9100'] # ดึงข้อมูลทรัพยากรของ Ubuntu Server

  - job_name: 'helpdesk_app'
    static_configs:
      - targets: ['web:5000'] # ดึงข้อมูลพฤติกรรมการใช้งาน Web App
